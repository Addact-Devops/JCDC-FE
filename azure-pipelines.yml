trigger:
  branches:
    include:
      - develop

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: BE
      type: git
      name: Addact-Project/JCDC
      ref: refs/heads/develop

variables:
  fe_dir:  $(Build.SourcesDirectory)/JCDC-FE
  be_dir:  $(Build.SourcesDirectory)/JCDC

steps:

  - checkout: self
    displayName: Checkout FE repo

  - checkout: BE
    displayName: Checkout BE repo
    persistCredentials: true

  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: 20.x

  - script: npm ci
    displayName: Install dependencies
    workingDirectory: $(fe_dir)

  - script: npm run build
    displayName: Build CSS and JS
    workingDirectory: $(fe_dir)

  - script: |
      mkdir -p $(be_dir)/src/Project/JCDC/website/css
      cp dist/main.css $(be_dir)/src/Project/JCDC/website/css/main.css
    displayName: Copy main.css to BE repo
    workingDirectory: $(fe_dir)

  - script: |
      mkdir -p $(be_dir)/src/Project/JCDC/website/js
      cp dist/main.js $(be_dir)/src/Project/JCDC/website/js/main.js
    displayName: Copy main.js to BE repo
    workingDirectory: $(fe_dir)

  - script: |
      mkdir -p $(be_dir)/src/Project/JCDC/website/assets
      rsync -av --update assets/ $(be_dir)/src/Project/JCDC/website/assets/
    displayName: Sync favicons to BE repo
    workingDirectory: $(fe_dir)

  - script: |
      git config user.email "devops-pipeline@addact.net"
      git config user.name "Azure DevOps Pipeline"

      git add src/Project/JCDC/website/css/main.css \
              src/Project/JCDC/website/js/main.js \
              src/Project/JCDC/website/assets/

      if git diff --cached --quiet; then
        echo "No changes detected — skipping commit."
      else
        git commit -m "Update the develop branch of BE with main.css & main.js & Assets folder with updated changes."
        git push origin develop
      fi
    displayName: Commit and push to BE repo
    workingDirectory: $(be_dir)